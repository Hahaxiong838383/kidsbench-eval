# KidsBench LLM Preset — Qwen Judge（NLI 内容判定专用）
#
# 用途：NLI 蕴含判定器（缺口1/2/3）的 judge 模型。
#   **必须独立于被测系统的内部 LLM**（被测锁 gemini-3-flash，judge 用 Qwen，避免自己判自己）。
#
# 供应商：SiliconFlow（硅基流动）
# API 文档（便于后续调整 qwen 系列模型参数）：
#   https://api-docs.siliconflow.cn/docs/api/chat-completions-post
#   - 可调参数：temperature / top_p / max_tokens / response_format(json_object) / enable_thinking 等
#   - 切换 qwen 系列模型：改下方 model 字段即可（如 Qwen/Qwen3-32B、Qwen/Qwen2.5-72B-Instruct 等）
#
# api_key 永不写在 preset 里，只通过 env 注入：
#   echo 'KIDSBENCH_QWEN_API_KEY=sk-xxxxxxx' >> ~/mycc/kidsbench-eval/.env.local
#   chmod 600 ~/mycc/kidsbench-eval/.env.local
name = "qwen-judge"
display_name = "Qwen3.6-35B-A3B (SiliconFlow, NLI Judge)"
provider = "siliconflow"
base_url = "https://api.siliconflow.cn/v1"
api_key_env = "KIDSBENCH_QWEN_API_KEY"
model = "Qwen/Qwen3.6-35B-A3B"
# NLI 判定要确定性：温度锁 0（在 nli_judge.py 调用时强制 temperature=0）
max_tokens = 1024
