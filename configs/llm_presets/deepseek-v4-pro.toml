# KidsBench LLM Preset — DeepSeek V4 Pro
# 用法：python -m harness.run_eval --llm-preset deepseek-v4-pro
#
# api_key 永不写在 preset 文件里，只通过 env 注入：
#   echo 'KIDSBENCH_DEEPSEEK_API_KEY=sk-xxxxxxx' >> ~/mycc/kidsbench-eval/.env.local
#   chmod 600 ~/mycc/kidsbench-eval/.env.local
name = "deepseek-v4-pro"
display_name = "DeepSeek V4 Pro"
provider = "deepseek"
base_url = "https://api.deepseek.com/v1"
api_key_env = "KIDSBENCH_DEEPSEEK_API_KEY"
model = "deepseek-v4-pro"
# DeepSeek 不支持 reasoning_effort，留空（运行时不传该参数）
max_tokens = 4096

[embedding]
provider = "huggingface"
model = "BAAI/bge-small-zh-v1.5"
dim = 512
