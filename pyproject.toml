[project]
name = "kidsbench-eval"
version = "0.1.0"
description = "KidsBench Memory System Evaluation Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Rayman Chen", email = "hahaxiong83@gmail.com" }
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "numpy>=1.24,<2.0",
    "httpx>=0.25",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 每个 adapter 一组可选依赖，按需装
mem0 = ["mem0ai>=0.1.0"]
letta = ["letta-client"]
embed = ["sentence-transformers>=2.5", "FlagEmbedding>=1.2"]
vector = ["qdrant-client>=1.7"]
graph = ["neo4j>=5.0"]
llm = ["dashscope>=1.20", "openai>=1.0"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kidsbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "integration: 需要真实第三方 SDK / 服务（mem0ai / memoryos-pypi / graphiti-core / FalkorDB 等）",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "E501",   # line too long（中文 docstring 容易超）
    "RUF001", # 全角字符串字符（中文 docstring 必有）
    "RUF002", # 全角 docstring 字符
    "RUF003", # 全角注释字符
    "RUF012", # 类属性可变默认值（paradigm_tags 是有意的类常量）
    "RUF022", # __all__ 字母排序（按语义分组更易读）
]
