# KidsBench L0.5 公共栈
#
# 所有 adapter 共享的服务：Vector DB / Graph DB / Cache
# 启动：docker compose -f docker/compose-base.yml up -d
# 停止：docker compose -f docker/compose-base.yml down
#
# 端口选择已避开 QNAP 已占用：22/80/139/445/2376/3000/3080/5000-5003/5444/8080/10052/58080

name: kidsbench-base

networks:
  kidsbench-net:
    name: kidsbench-net
    driver: bridge

volumes:
  qdrant_data:
    name: kidsbench_qdrant_data
  falkor_data:
    name: kidsbench_falkor_data
  redis_data:
    name: kidsbench_redis_data

services:
  # 向量数据库：Mem0 / Cognee / 通用 vector 检索
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: kidsbench-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"     # HTTP API
      - "6334:6334"     # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - kidsbench-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 图数据库：Graphiti / Cognee KG（比 Neo4j 轻 ~3x，单容器 ~200MB vs Neo4j ~1GB）
  falkordb:
    image: falkordb/falkordb:latest
    container_name: kidsbench-falkordb
    restart: unless-stopped
    ports:
      - "6379:6379"     # Redis 协议端口（FalkorDB = Redis Stack 之上的 Graph 模块）
    volumes:
      - falkor_data:/data
    networks:
      - kidsbench-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 缓存 / sidecar 持久化 / 限流计数
  # 端口 6380 避开 falkordb 占的 6379
  redis-cache:
    image: redis:7-alpine
    container_name: kidsbench-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - kidsbench-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
