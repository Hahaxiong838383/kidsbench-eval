# KidsBench frontend nginx (B0 + B1 SSE 预留 + AI 助手限速)
# 反代 /api 到 backend，static serve React SPA

# AI 助手限速 zone（评审 P0：公网防滥用第一道闸；conf.d 在 http 级 include，
# zone 定义必须在 server 块外）
limit_req_zone $binary_remote_addr zone=assistant_chat:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=assistant_auth:10m rate=5r/m;

server {
    listen 80 default_server;
    server_name _;

    # 安全 / 默认头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态文件 gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # SSE 长连接路径（B1 用，提前配好）
    location ~ ^/api/run/.*?/stream$ {
        proxy_pass http://kidsbench-web-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # AI 助手 chat SSE：流式长连接（评审 P1：通用 /api/ 60s 超时会切断流）
    location = /api/assistant/chat {
        limit_req zone=assistant_chat burst=5 nodelay;
        proxy_pass http://kidsbench-web-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Accel-Buffering no;
    }

    # 助手会话/管理登录：更严限速（防手机号枚举与密码爆破）
    location ~ ^/api/(assistant/session|admin/login)$ {
        limit_req zone=assistant_auth burst=3 nodelay;
        proxy_pass http://kidsbench-web-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 其他 API 走标准反代
    location /api/ {
        proxy_pass http://kidsbench-web-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 健康检查直通
    location /healthz {
        proxy_pass http://kidsbench-web-backend:8000;
    }

    # React SPA：fallback 到 index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # HTML 永远不缓存（防 hash 变了但浏览器加载旧 HTML 引用 404 JS 导致白屏）
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        # SPA 资源 hash 化文件名长期缓存
        location ~* \.(js|css|woff2?|svg|png|jpe?g|ico)$ {
            root /usr/share/nginx/html;
            expires 7d;
            access_log off;
            add_header Cache-Control "public, max-age=604800, immutable";
        }
    }
}
