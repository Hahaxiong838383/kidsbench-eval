# KidsBench frontend nginx (B0 + B1 SSE 预留)
# 反代 /api 到 backend，static serve React SPA

server {
    listen 80 default_server;
    server_name _;

    # 安全 / 默认头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态文件 gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # SSE 长连接路径（B1 用，提前配好）
    location ~ ^/api/run/.*?/stream$ {
        proxy_pass http://kidsbench-web-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # 其他 API 走标准反代
    location /api/ {
        proxy_pass http://kidsbench-web-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 健康检查直通
    location /healthz {
        proxy_pass http://kidsbench-web-backend:8000;
    }

    # React SPA：fallback 到 index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # SPA 资源长期缓存
        location ~* \.(js|css|woff2?|svg|png|jpe?g|ico)$ {
            root /usr/share/nginx/html;
            expires 7d;
            access_log off;
        }
    }
}
